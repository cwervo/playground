</g>
<text x="932" y="152" font-size="26" fill="#16234f" font-weight="700" filter="url(#inkHeavy)">MARGINALIA</text>
<text x="932" y="180" font-size="14.5" fill="#23336a" filter="url(#ink)">answers, in ink</text>
<circle cx="944" cy="242" r="17" fill="#16234f"/>
<text x="944" y="248" font-size="18" fill="#f6ea3d" font-weight="700" text-anchor="middle">1</text>
<text x="976" y="238" font-size="20" fill="#152a63" filter="url(#ink)" xml:space="preserve">1967 — premiered that Dec.</text>
<text x="976" y="272" font-size="20" fill="#152a63" filter="url(#ink)" xml:space="preserve">at Knokke-le-Zoute, Belgium.</text>
<circle cx="944" cy="410" r="17" fill="#16234f"/>
<text x="944" y="416" font-size="18" fill="#f6ea3d" font-weight="700" text-anchor="middle">2</text>
<text x="976" y="406" font-size="20" fill="#152a63" filter="url(#ink)" xml:space="preserve">Jacques Ledoux's EXPRMNTL</text>
<text x="976" y="440" font-size="20" fill="#152a63" filter="url(#ink)" xml:space="preserve">festival: free Agfa-Gevaert</text>
<text x="976" y="474" font-size="20" fill="#152a63" filter="url(#ink)" xml:space="preserve">stock; won the Prix de l'Age d'Or.</text>
<circle cx="944" cy="612" r="17" fill="#16234f"/>
<text x="944" y="618" font-size="18" fill="#f6ea3d" font-weight="700" text-anchor="middle">3</text>
<text x="976" y="608" font-size="20" fill="#152a63" filter="url(#ink)" xml:space="preserve">~15 min, shot on 16mm B&amp;W.</text>
<circle cx="944" cy="746" r="17" fill="#16234f"/>
<text x="944" y="752" font-size="18" fill="#f6ea3d" font-weight="700" text-anchor="middle">4</text>
<text x="976" y="742" font-size="20" fill="#152a63" filter="url(#ink)" xml:space="preserve">NYU student film (Tisch) —</text>
<text x="976" y="776" font-size="20" fill="#152a63" filter="url(#ink)" xml:space="preserve">won a Producers Guild award.</text>
<circle cx="944" cy="914" r="17" fill="#16234f"/>
<text x="944" y="920" font-size="18" fill="#f6ea3d" font-weight="700" text-anchor="middle">5</text>
<text x="976" y="910" font-size="20" fill="#152a63" filter="url(#ink)" xml:space="preserve">9 minutes.</text>
<circle cx="944" cy="1048" r="17" fill="#16234f"/>
<text x="944" y="1054" font-size="18" fill="#f6ea3d" font-weight="700" text-anchor="middle">6</text>
<text x="976" y="1044" font-size="20" fill="#152a63" filter="url(#ink)" xml:space="preserve">1963.</text>
<circle cx="944" cy="1182" r="17" fill="#16234f"/>
<text x="944" y="1188" font-size="18" fill="#f6ea3d" font-weight="700" text-anchor="middle">7</text>
<text x="976" y="1178" font-size="20" fill="#152a63" filter="url(#ink)" xml:space="preserve">NYU — Scorsese's first film.</text>
<circle cx="944" cy="1316" r="17" fill="#16234f"/>
<text x="944" y="1322" font-size="18" fill="#f6ea3d" font-weight="700" text-anchor="middle">8</text>
<text x="976" y="1312" font-size="20" fill="#152a63" filter="url(#ink)" xml:space="preserve">Editors: Scorsese cut THE BIG</text>
<text x="976" y="1346" font-size="20" fill="#152a63" filter="url(#ink)" xml:space="preserve">SHAVE himself; Eli F. Bleich cut</text>
<text x="976" y="1380" font-size="20" fill="#152a63" filter="url(#ink)" xml:space="preserve">MURRAY!; Robert Hunsicker cut</text>
<text x="976" y="1414" font-size="20" fill="#152a63" filter="url(#ink)" xml:space="preserve">NICE GIRL — all NYU-era peers.</text>
