<text x="60" y="78" font-size="25" fill="#e9edf2" font-weight="600">Scorsese shorts — the ?’s, extracted &amp; answered</text>
<text x="60" y="104" font-size="14" fill="#5f6b78">glyphs pulled from IMG_7339.png pixels · reproduced in IBM Plex Mono</text>
<text x="60" y="150.0" font-size="23.0" fill="#8bd6c0" xml:space="preserve">## "Letterboxd"</text>
<text x="60" y="238.0" font-size="23.0" fill="#dfe4ea" xml:space="preserve">Scorsese shorts:</text>
<text x="60" y="282.0" font-size="23.0" fill="#dfe4ea" xml:space="preserve">"The Big Shave (5m, <tspan fill="#ffd23f">?</tspan><tspan baseline-shift="super" font-size="15.0" fill="#ff9e2c" font-weight="600">1</tspan>, funded by <tspan fill="#ffd23f">?</tspan><tspan baseline-shift="super" font-size="15.0" fill="#ff9e2c" font-weight="600">2</tspan>)</text>
<text x="60" y="326.0" font-size="23.0" fill="#dfe4ea" xml:space="preserve">"it's Not Just You Murray (<tspan fill="#ffd23f">?</tspan><tspan baseline-shift="super" font-size="15.0" fill="#ff9e2c" font-weight="600">3</tspan>m, 1964, <tspan fill="#ffd23f">?</tspan><tspan baseline-shift="super" font-size="15.0" fill="#ff9e2c" font-weight="600">4</tspan>)</text>
<text x="60" y="370.0" font-size="23.0" fill="#dfe4ea" xml:space="preserve">"What's a nice girl like you doing in a place like this?"</text>
<text x="60" y="414.0" font-size="23.0" fill="#dfe4ea" xml:space="preserve">(<tspan fill="#ffd23f">?</tspan><tspan baseline-shift="super" font-size="15.0" fill="#ff9e2c" font-weight="600">5</tspan>, <tspan fill="#ffd23f">?</tspan><tspan baseline-shift="super" font-size="15.0" fill="#ff9e2c" font-weight="600">6</tspan>, <tspan fill="#ffd23f">?</tspan><tspan baseline-shift="super" font-size="15.0" fill="#ff9e2c" font-weight="600">7</tspan>)</text>
<text x="60" y="502.0" font-size="23.0" fill="#dfe4ea" xml:space="preserve">-<tspan fill="#ffd23f">???</tspan><tspan baseline-shift="super" font-size="15.0" fill="#ff9e2c" font-weight="600">8</tspan>: What are the editors of these pictures? What</text>
<text x="60" y="546.0" font-size="23.0" fill="#dfe4ea" xml:space="preserve">else have they edited??</text>
<rect x="48" y="648" width="800" height="902" rx="14" fill="#0e1519" stroke="#1c2730" stroke-width="1.3"/>
<text x="70" y="682" font-size="17" fill="#63b8a2" font-weight="600">▸ GLYPH EXTRACTION LOG  ·  ? tokens → pixel (x,y)</text>
<text x="70" y="712" font-size="13.5" fill="#54606b">detected 9 text bands in a 1206px-wide bitmap by brightness projection</text>
<text x="70" y="748" font-size="14" fill="#7f8b96" xml:space="preserve">  #   token   orig-x   orig-y     band-rows</text>
<text x="70" y="778" font-size="15" fill="#aeb8c2" xml:space="preserve">  1    ?         484      578      560–597</text>
<text x="70" y="808" font-size="15" fill="#aeb8c2" xml:space="preserve">  2    ?         740      578      560–597</text>
<text x="70" y="838" font-size="15" fill="#aeb8c2" xml:space="preserve">  3    ?         602      648      630–666</text>
<text x="70" y="868" font-size="15" fill="#aeb8c2" xml:space="preserve">  4    ?         791      648      630–666</text>
<text x="70" y="898" font-size="15" fill="#aeb8c2" xml:space="preserve">  5    ?         104      786      768–804</text>
<text x="70" y="928" font-size="15" fill="#aeb8c2" xml:space="preserve">  6    ?         148      786      768–804</text>
<text x="70" y="958" font-size="15" fill="#aeb8c2" xml:space="preserve">  7    ?         191      786      768–804</text>
<text x="70" y="988" font-size="15" fill="#aeb8c2" xml:space="preserve">  8    ???       129      920      905–935</text>
<text x="70" y="1032" font-size="13" fill="#4c5762" xml:space="preserve">columns from character-fraction along each detected line's ink extent</text>
