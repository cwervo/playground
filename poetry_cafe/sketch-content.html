<!-- This div will hold the p5.js canvas -->
<div id="p5-canvas-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;"></div>
<!-- p5.js library -->
<script src="js/p5.min.js"></script>
<!-- p5.js sound library -->
<script src="js/p5.sound.min.js"></script>
<!-- Tone.js library -->
<script src="js/tone.min.js"></script>
<!-- The p5.js sketch -->
<script src="js/sketch.js"></script>
<script>
  // Ensure p5.js is loaded and then initialize the sketch
  if (typeof p5 !== 'undefined') {
    // Wait for Tone.js to be ready
    Tone.start().then(() => {
      console.log("Tone.js started");
      // Attach p5 sketch to the specific container, not the global window
      let sketchInstance = new p5(sketch, document.getElementById('p5-canvas-container'));
    }).catch(e => console.error("Error starting Tone.js", e));
  } else {
    console.error('p5.js not loaded yet.');
  }
</script>
