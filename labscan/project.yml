name: LabScan
options:
  bundleIdPrefix: com.cwervo
  deploymentTarget:
    iOS: "17.0"
targets:
  LabScan:
    type: application
    platform: iOS
    sources: [LabScan]
    settings:
      base:
        INFOPLIST_KEY_NSCameraUsageDescription: "LabScan uses the camera to scan barcodes and detect paper. Everything stays on this device."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "LabScan V2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 2.0
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 5.9
