<title>Robert Irwin Within 300 Miles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&family=Newsreader:opsz,wght@6..72,300..500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light;
  --plane:#E7EAEC; --surface:#F6F8F8; --surface-2:#EFF2F3; --edge:rgba(18,23,26,.13);
  --ink:#111619; --ink-2:#4C565C; --ink-3:#7A868D;
  --sea:#F4F7F8;
  --b0:#E1E6E9; --b1:#CBD3D7; --b2:#B3BEC4; --b3:#98A6AE; --b4:#7E8D96; --b5:#63737E;
  --land:#DFE5E8; --park:#CBD8D2;
  --outland:#E9ECEE; --hair:rgba(18,23,26,.16); --ring:rgba(18,23,26,.30);
  /* mode hues — validated all-pairs, both modes (see the note in the footer) */
  --m-foot:#0d8f73; --m-subway:#4858eb; --m-metronorth:#359bd9;
  --m-amtrak:#d0020f; --m-car:#bf851e; --m-plane:#ad27ad; --m-lirr:#7A868D;
  --casing:#F6F8F8;
  --shadow:0 1px 2px rgba(18,23,26,.05), 0 8px 28px -14px rgba(18,23,26,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#0B0E10; --surface:#12171A; --surface-2:#171D21; --edge:rgba(237,241,243,.14);
    --ink:#EDF1F3; --ink-2:#A3AEB4; --ink-3:#77838A;
    --sea:#080B0D;
    --b0:#1C242A; --b1:#243038; --b2:#2E3C45; --b3:#394953; --b4:#455761; --b5:#52656F;
    --land:#232E35; --park:#22332C;
    --outland:#101518; --hair:rgba(237,241,243,.17); --ring:rgba(237,241,243,.32);
    --casing:#12171A;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0B0E10; --surface:#12171A; --surface-2:#171D21; --edge:rgba(237,241,243,.14);
  --ink:#EDF1F3; --ink-2:#A3AEB4; --ink-3:#77838A;
  --sea:#080B0D;
  --b0:#1C242A; --b1:#243038; --b2:#2E3C45; --b3:#394953; --b4:#455761; --b5:#52656F;
    --land:#232E35; --park:#22332C;
  --outland:#101518; --hair:rgba(237,241,243,.17); --ring:rgba(237,241,243,.32);
  --casing:#12171A;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -14px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font-family:"Newsreader",Georgia,"Times New Roman",serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1440px; margin:0 auto; padding:clamp(20px,3.4vw,52px) clamp(16px,3vw,44px) 72px;}
.mono{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;}
.grot{font-family:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;}

/* ---------- header ---------- */
.eyebrow{
  font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-3); margin:0 0 18px;
}
h1{
  font-family:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-variation-settings:"wdth" 118,"wght" 640;
  font-size:clamp(34px,6.2vw,76px); line-height:.94; letter-spacing:-.022em;
  margin:0 0 22px; text-wrap:balance; max-width:16ch;
}
.dek{font-size:clamp(16px,1.5vw,19px); line-height:1.6; color:var(--ink-2); max-width:62ch; margin:0;}
.dek em{font-style:italic; color:var(--ink);}

.stats{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
  gap:1px; background:var(--edge); border:1px solid var(--edge);
  margin:34px 0 0; border-radius:3px; overflow:hidden;
}
.stat{background:var(--surface); padding:16px 18px 18px;}
.stat b{
  display:block; font-family:"Archivo",Helvetica,Arial,sans-serif;
  font-variation-settings:"wdth" 112,"wght" 620;
  font-size:clamp(28px,3.4vw,40px); line-height:1; letter-spacing:-.02em;
}
.stat span{
  display:block; margin-top:9px; font-family:"IBM Plex Mono",Menlo,monospace;
  font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3); line-height:1.5;
}

/* ---------- layout ---------- */
.board{display:grid; grid-template-columns:minmax(0,1.62fr) minmax(300px,1fr); gap:22px; margin-top:34px; align-items:start;}
@media (max-width:1020px){ .board{grid-template-columns:1fr;} }
.panel{background:var(--surface); border:1px solid var(--edge); border-radius:4px; box-shadow:var(--shadow);}
.panel-hd{
  display:flex; justify-content:space-between; align-items:baseline; gap:14px;
  padding:14px 18px; border-bottom:1px solid var(--edge);
}
.panel-hd h2{
  margin:0; font-family:"Archivo",Helvetica,Arial,sans-serif;
  font-variation-settings:"wdth" 108,"wght" 600;
  font-size:13px; letter-spacing:.055em; text-transform:uppercase;
}
.panel-hd .hint{font-family:"IBM Plex Mono",Menlo,monospace; font-size:10.5px; color:var(--ink-3); letter-spacing:.05em;}
.side{display:flex; flex-direction:column; gap:22px;}

svg{display:block; width:100%; height:auto;}
.mapwrap{padding:10px;}

/* ---------- map marks ---------- */
.county{stroke:var(--casing); stroke-width:.45; vector-effect:non-scaling-stroke; transition:opacity .12s;}
.county:hover{opacity:.72; cursor:crosshair;}
.stateline{fill:none; stroke:var(--hair); stroke-width:1; vector-effect:non-scaling-stroke; pointer-events:none;}
.outland{fill:var(--outland); stroke:var(--hair); stroke-width:.8; vector-effect:non-scaling-stroke; pointer-events:none;}
.ring{fill:none; stroke:var(--ring); stroke-width:1; stroke-dasharray:3 6; vector-effect:non-scaling-stroke; pointer-events:none;}
.ringlab{font-family:"IBM Plex Mono",Menlo,monospace; font-size:11px; fill:var(--ink-3);
  paint-order:stroke; stroke:var(--sea); stroke-width:4; stroke-linejoin:round; pointer-events:none;}
.keylab{font-family:"IBM Plex Mono",Menlo,monospace; font-size:11.5px; fill:var(--ink-2);
  paint-order:stroke; stroke:var(--sea); stroke-width:3.5; pointer-events:none;}
.keyhd{font-family:"IBM Plex Mono",Menlo,monospace; font-size:10.5px; letter-spacing:.13em;
  fill:var(--ink-3); paint-order:stroke; stroke:var(--sea); stroke-width:3.5; pointer-events:none;}
.casing{fill:none; stroke:var(--casing); stroke-width:6.5; stroke-linecap:round; vector-effect:non-scaling-stroke; pointer-events:none;}
.route{fill:none; stroke-width:2.6; stroke-linecap:round; vector-effect:non-scaling-stroke; pointer-events:none; transition:opacity .18s;}
.hit{fill:none; stroke:transparent; stroke-width:16; vector-effect:non-scaling-stroke; cursor:pointer;}
.mk{cursor:pointer;}
.mk .halo{fill:none; stroke:var(--casing); stroke-width:3.2; vector-effect:non-scaling-stroke;}
.lab{
  font-family:"Archivo",Helvetica,Arial,sans-serif; font-variation-settings:"wdth" 96,"wght" 600;
  font-size:12.5px; fill:var(--ink); paint-order:stroke; stroke:var(--casing); stroke-width:3.4;
  stroke-linejoin:round; pointer-events:none;
}
.lab.sm{font-size:11.5px;}
.dim{opacity:.13;}
.on{opacity:1;}
.waterlab text{font-family:"IBM Plex Mono",Menlo,monospace; font-size:10px; letter-spacing:.14em;
  fill:var(--ink-3); paint-order:stroke; stroke:var(--casing); stroke-width:3; opacity:.9;}
.origin-lab{font-family:"IBM Plex Mono",Menlo,monospace; font-size:10.5px; letter-spacing:.08em;
  fill:var(--ink-2); paint-order:stroke; stroke:var(--casing); stroke-width:3.4; pointer-events:none;}

/* ---------- legends ---------- */
.legend{padding:16px 18px 18px;}
.chip{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  background:none; border:0; border-radius:3px; padding:7px 8px; cursor:pointer;
  color:var(--ink); font-family:inherit; font-size:14.5px; line-height:1.3;
}
.chip:hover{background:var(--surface-2);}
.chip:focus-visible{outline:2px solid var(--ink); outline-offset:1px;}
.chip[aria-pressed="false"]{color:var(--ink-3);}
.chip[aria-pressed="false"] .swatch{opacity:.24;}
.chip .swatch{flex:0 0 34px; height:14px;}
.chip .ct{margin-left:auto; font-family:"IBM Plex Mono",Menlo,monospace; font-size:11px; color:var(--ink-3);}
.chip.null{cursor:default;}
.chip.null:hover{background:none;}
.legend-note{margin:12px 8px 0; font-size:13px; line-height:1.5; color:var(--ink-2);}

.bands{display:flex; margin:2px 8px 0; border-radius:2px; overflow:hidden;}
.bands div{flex:1; height:14px;}
.bandlabs{display:flex; justify-content:space-between; margin:7px 8px 0;
  font-family:"IBM Plex Mono",Menlo,monospace; font-size:10.5px; color:var(--ink-3); letter-spacing:.04em;}

/* ---------- detail card ---------- */
.detail{padding:20px 18px; min-height:200px; display:grid; gap:14px 36px;
  grid-template-columns:minmax(0,1.45fr) minmax(210px,.8fr); align-items:start;}
.detail > .col{max-width:64ch;}
@media (max-width:820px){ .detail{grid-template-columns:1fr;}
  .detail .how{padding:14px 0 0; border-left:0; border-top:1px solid var(--edge);} }
.detail .kicker{display:flex; align-items:center; gap:9px; margin-bottom:11px;}
.detail .kicker i{width:12px; height:12px; border-radius:50%; display:block; flex:0 0 12px;}
.detail .kicker span{font-family:"IBM Plex Mono",Menlo,monospace; font-size:10.5px;
  letter-spacing:.11em; text-transform:uppercase; color:var(--ink-2);}
.detail h3{margin:0 0 3px; font-family:"Archivo",Helvetica,Arial,sans-serif;
  font-variation-settings:"wdth" 106,"wght" 600; font-size:20px; line-height:1.2; letter-spacing:-.01em;}
.detail .place{margin:0 0 13px; font-size:14px; color:var(--ink-3);}
.detail .work{margin:0 0 11px; font-size:16px; font-style:italic; line-height:1.45;}
.detail p.note{margin:0 0 13px; font-size:14.5px; line-height:1.6; color:var(--ink-2);}
.detail .how{margin:0; padding:0 0 0 22px; border-left:1px solid var(--edge);
  font-family:"IBM Plex Mono",Menlo,monospace; font-size:12px; line-height:1.65; color:var(--ink-2);}

.tag{display:inline-block; font-family:"IBM Plex Mono",Menlo,monospace; font-size:10px;
  letter-spacing:.09em; text-transform:uppercase; padding:3px 7px; border:1px solid var(--edge);
  border-radius:2px; color:var(--ink-2); background:var(--surface-2);}

/* ---------- table ---------- */
.tablewrap{overflow-x:auto;}
table{border-collapse:collapse; width:100%; min-width:760px; font-size:14.5px;}
th,td{text-align:left; padding:11px 18px; border-bottom:1px solid var(--edge); vertical-align:top;}
th{font-family:"IBM Plex Mono",Menlo,monospace; font-size:10px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-3); font-weight:500; white-space:nowrap;}
td.num{font-family:"IBM Plex Mono",Menlo,monospace; font-variant-numeric:tabular-nums; white-space:nowrap;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:var(--surface-2);}
tbody tr:last-child td{border-bottom:0;}
td .w{font-style:italic; color:var(--ink-2); display:block; margin-top:2px; font-size:13.5px;}
.modecell{display:flex; align-items:center; gap:8px; white-space:nowrap;}
.modecell i{width:16px; height:3px; flex:0 0 16px; border-radius:2px;}

/* ---------- tooltip + footer ---------- */
#tip{
  position:fixed; z-index:20; pointer-events:none; opacity:0; transition:opacity .1s;
  background:var(--surface); border:1px solid var(--edge); border-radius:3px;
  box-shadow:var(--shadow); padding:7px 10px;
  font-family:"IBM Plex Mono",Menlo,monospace; font-size:11.5px; line-height:1.5; color:var(--ink);
}
footer{margin-top:44px; padding-top:26px; border-top:1px solid var(--edge);
  font-size:13.5px; line-height:1.65; color:var(--ink-2); max-width:76ch;}
footer h4{margin:0 0 8px; font-family:"IBM Plex Mono",Menlo,monospace; font-size:10.5px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:500;}
footer p{margin:0 0 16px;}
footer a{color:var(--ink); text-decoration-color:var(--ink-3); text-underline-offset:2px;}
.sect{margin-top:34px;}
.sect > h2{margin:0 0 14px; font-family:"Archivo",Helvetica,Arial,sans-serif;
  font-variation-settings:"wdth" 112,"wght" 620; font-size:clamp(19px,2.1vw,25px); letter-spacing:-.012em;}

/* the SVG scales down on phones; scale the type up in user units to compensate */
@media (max-width:760px){
  .lab{font-size:18px; stroke-width:4.6;} .lab.sm{font-size:16px;}
  .ringlab{font-size:15px;} .keylab{font-size:16px;} .keyhd{font-size:14px;}
  .origin-lab{font-size:15px;} .waterlab text{font-size:14px;}
  .county{stroke-width:.35;}
}
@media (prefers-reduced-motion:no-preference){
  .fade{opacity:0; animation:fade .5s ease forwards;}
  @keyframes fade{to{opacity:1}}
}
</style>
