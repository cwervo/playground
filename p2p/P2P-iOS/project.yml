name: P2P
options:
  bundleIdPrefix: com.cwervo
  deploymentTarget:
    iOS: "17.0"
targets:
  P2P:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: P2P
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "P2P needs access to the camera to take pictures for text recognition."
        NSPhotoLibraryUsageDescription: "P2P needs access to your photos to process them."
        NSPhotoLibraryAddUsageDescription: "P2P needs access to save exported images to your photos."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cwervo.P2P
        DEVELOPMENT_TEAM: SSXLVBK7F6
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
