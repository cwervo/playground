<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#070b14" />
<title>Soft Morphs</title>
<style>
  :root {
    --bg: #070b14; --panel: #0e1626; --line: #1e2c44; --ink: #dbe7f5; --dim: #7f93ad;
    --teal: #5eead4; --blue: #7dd3fc; --violet: #c4b5fd; --hot: #fb923c; --gold: #fde047;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 14px/1.35 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .02em; flex: 1; white-space: nowrap; }
  header h1 span { color: var(--teal); }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: none; color: var(--dim); font: inherit; font-weight: 600;
    padding: 8px 16px; border-radius: 999px; min-height: 38px; }
  .seg button.on { background: var(--teal); color: #04221f; }
  main { flex: 1; position: relative; min-height: 0; }
  section { position: absolute; inset: 0; display: none; flex-direction: column; }
  section.on { display: flex; }
  canvas { display: block; width: 100%; touch-action: none; }
  #pad { flex: 1; min-height: 0; }
  #padHint { position: absolute; top: 10px; left: 0; right: 0; text-align: center; color: var(--dim);
    font-size: 12px; pointer-events: none; }
  .panel { background: var(--panel); border-top: 1px solid var(--line);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 9px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .chips { overflow-x: auto; scrollbar-width: none; margin: 0 -12px; padding: 0 12px; }
  .chips::-webkit-scrollbar { display: none; }
  button.chip, button.btn { border: 1px solid var(--line); background: #131d31; color: var(--ink); font: inherit;
    border-radius: 10px; padding: 0 13px; min-height: 40px; white-space: nowrap; flex: none; }
  button.chip.on { border-color: var(--teal); color: var(--teal); }
  button.go { background: var(--teal); color: #04221f; border: 0; font-weight: 700; flex: 1; min-height: 46px;
    border-radius: 12px; font-size: 15px; }
  button:active { filter: brightness(1.25); }
  .sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
  .sliders label { display: flex; flex-direction: column; gap: 1px; color: var(--dim); font-size: 12px; }
  .sliders label b { color: var(--ink); font-weight: 600; float: right; }
  input[type=range] { width: 100%; accent-color: var(--teal); height: 26px; margin: 0; }
  #genome { margin: 0; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim);
    background: #0a111e; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px;
    white-space: pre; overflow-x: auto; }
  #genome i { color: var(--teal); font-style: normal; } #genome u { color: var(--hot); text-decoration: none; }
  #gl { flex: 1; min-height: 0; }
  #hud { position: absolute; top: 10px; left: 12px; pointer-events: none; font: 12px/1.5 ui-monospace, Menlo, monospace;
    color: var(--ink); text-shadow: 0 1px 3px #000; }
  #hud b { font-size: 20px; color: var(--teal); font-weight: 600; }
  #courses { position: absolute; top: 10px; right: 12px; }
  #courses button { padding: 6px 12px; min-height: 34px; font-size: 13px; }
  #banner { position: absolute; left: 0; right: 0; top: 34%; text-align: center; font-size: 26px; font-weight: 700;
    color: var(--gold); text-shadow: 0 2px 12px #000; pointer-events: none; opacity: 0; transition: opacity .4s; }
  #banner.on { opacity: 1; }
  .steer { position: absolute; bottom: calc(118px + env(safe-area-inset-bottom)); width: 62px; height: 62px;
    border-radius: 50%; border: 1px solid var(--line); background: rgba(14,22,38,.72); color: var(--ink);
    font-size: 22px; touch-action: none; }
  .steer.on { border-color: var(--teal); color: var(--teal); }
  #sl { left: 14px; } #sr { right: 14px; }
  .simbar .btn, .simbar .chip { flex: 1; padding: 0 6px; min-width: 0; }
  .simbar label { color: var(--dim); font-size: 12px; white-space: nowrap; }
  @media (min-width: 820px) and (orientation: landscape) {
    #draw.on { flex-direction: row; } #draw .panel { width: 360px; border-top: 0; border-left: 1px solid var(--line); justify-content: flex-end; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>soft<span>·morphs</span></h1>
    <div class="seg" id="tabs">
      <button data-tab="draw" class="on">Draw</button>
      <button data-tab="sim">Simulate</button>
    </div>
  </header>
  <main>
    <section id="draw" class="on">
      <canvas id="pad"></canvas>
      <div id="padHint">First stroke is the spine, starting at the head. Later strokes attach as limbs; no limbs → it grows prolegs.</div>
      <div class="panel">
        <div class="row chips" id="presets"></div>
        <div class="sliders">
          <label><span>Cell divisions <b id="vDiv"></b></span><input id="pDiv" type="range" min="1" max="3" step="1"></label>
          <label><span>Bus width <b id="vBus"></b></span><input id="pBus" type="range" min="3" max="8" step="1"></label>
          <label><span>Branch recursion <b id="vBranch"></b></span><input id="pBranch" type="range" min="0" max="2" step="1"></label>
          <label><span>Thickness <b id="vThick"></b></span><input id="pThick" type="range" min="0" max="1" step="0.05"></label>
        </div>
        <pre id="genome"></pre>
        <div class="row">
          <button class="btn" id="undo">Undo</button>
          <button class="btn" id="clear">Clear</button>
          <button class="chip" id="mirror">Mirror</button>
          <button class="go" id="grow">Grow &amp; run ▶</button>
        </div>
      </div>
    </section>
    <section id="sim">
      <canvas id="gl"></canvas>
      <div id="hud"></div>
      <div class="seg" id="courses">
        <button data-course="maze" class="on">Maze</button>
        <button data-course="mountain">Mountain</button>
      </div>
      <div id="banner"></div>
      <button class="steer" id="sl" aria-label="Steer left">◀</button>
      <button class="steer" id="sr" aria-label="Steer right">▶</button>
      <div class="panel simbar">
        <div class="row">
          <label for="pFreq">Gait</label><input id="pFreq" type="range" min="0.4" max="1.8" step="0.1" value="1.1">
        </div>
        <div class="row">
          <button class="btn" id="reset">↺ Retry</button>
          <button class="btn" id="pause">❚❚ Pause</button>
          <button class="btn" id="newc">⚄ New</button>
          <button class="chip on" id="auto">Auto</button>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
"use strict";
//<core> ------------------------------------------------------------------
// Everything between the core markers is DOM-free so it can be run headless.
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(ix, iz, s) { let h = Math.imul(ix, 374761393) ^ Math.imul(iz, 668265263) ^ Math.imul(s, 1274126177);
  h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
function vnoise(x, z, s) { const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz,
  u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  return lerp(lerp(hash2(ix, iz, s), hash2(ix + 1, iz, s), u), lerp(hash2(ix, iz + 1, s), hash2(ix + 1, iz + 1, s), u), v) * 2 - 1; }
function fbm(x, z, s, oct) { let sum = 0, a = 1, f = 1; for (let i = 0; i < oct; i++) { sum += a * vnoise(x * f, z * f, s + i * 17); a *= .5; f *= 2.03; } return sum; }

// ---- 2D polyline helpers (points are [x, z]) ----
function plen(p) { let L = 0; for (let i = 1; i < p.length; i++) L += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return L; }
function resample(p, n) {
  const L = plen(p), out = [p[0].slice()]; let acc = 0, k = 1;
  for (let i = 1; i < p.length && k < n; i++) {
    const a = p[i - 1], b = p[i], d = Math.hypot(b[0] - a[0], b[1] - a[1]);
    while (k < n && d > 0 && acc + d >= L * k / n - 1e-9) { const t = (L * k / n - acc) / d; out.push([lerp(a[0], b[0], t), lerp(a[1], b[1], t)]); k++; }
    acc += d;
  }
  while (out.length < n) out.push(p[p.length - 1].slice());
  out.push(p[p.length - 1].slice()); return out;
}
function nearestOn(p, q) {
  let best = { d: 1e9, pt: p[0], u: 0 }, acc = 0; const L = plen(p) || 1;
  for (let i = 1; i < p.length; i++) {
    const a = p[i - 1], b = p[i], vx = b[0] - a[0], vz = b[1] - a[1], l2 = vx * vx + vz * vz, l = Math.sqrt(l2);
    const t = l2 ? clamp(((q[0] - a[0]) * vx + (q[1] - a[1]) * vz) / l2, 0, 1) : 0, x = a[0] + vx * t, z = a[1] + vz * t;
    const d = Math.hypot(q[0] - x, q[1] - z);
    if (d < best.d) best = { d, pt: [x, z], u: (acc + l * t) / L };
    acc += l;
  }
  return best;
}

// ---- Growth: strokes (the axiom) -> tubes of cells ----
// A creature is a tree of tubes. Every tube is a chain of cells; every edge between
// neighbouring cells is a *bus* of K parallel wires (the ring of K muscle springs),
// not a single wire. "Cell divisions" doubles the cells along every tube, and
// "branch recursion" re-applies the limb rule to its own output at 0.55 scale.
const BODY_LEN = 2.6, MAX_SPAN = 3.6, MAX_PARTICLES = 1100;
function buildPlan(strokes, P, divOverride) {
  const S = strokes.filter(s => s.length > 1 && plen(s) > 0.03);
  if (!S.length) return null;
  const sp = S[0], head = sp[0], tail = sp[sp.length - 1];
  const ox = (head[0] + tail[0]) / 2, oy = (head[1] + tail[1]) / 2;
  let ext = 0; for (const st of S) for (const q of st) ext = Math.max(ext, Math.hypot(q[0] - ox, q[1] - oy));
  const sc = Math.min(BODY_LEN / plen(sp), MAX_SPAN / (2 * ext));     // spine is 2.6 long unless the limbs would not fit a corridor
  let dx = head[0] - tail[0], dz = -(head[1] - tail[1]); const dl = Math.hypot(dx, dz);
  if (dl < 1e-4) { dx = 0; dz = 1; } else { dx /= dl; dz /= dl; }
  // pad space -> creature space, head pointing along +z
  const toLocal = p => { const x = (p[0] - ox) * sc, z = -(p[1] - oy) * sc; return [x * dz - z * dx, x * dx + z * dz]; };
  const toPad = (X, Z) => { const x = X * dz + Z * dx, z = -X * dx + Z * dz; return [x / sc + ox, -z / sc + oy]; };

  const tubes = [{ kind: 'spine', gen: 0, parent: -1, u: 0, pts: S[0].map(toLocal) }];
  const drawn = [];
  for (let i = 1; i < S.length; i++) {
    const p = S[i].map(toLocal); drawn.push(p);
    if (P.mirror) { const off = p.reduce((a, q) => a + Math.abs(q[0]), 0) / p.length; if (off > 0.12) drawn.push(p.map(q => [-q[0], q[1]])); }
  }
  const attach = p => {
    let best = null;
    for (let ti = 0; ti < tubes.length; ti++) for (const end of [0, 1]) {
      const r = nearestOn(tubes[ti].pts, end ? p[p.length - 1] : p[0]);
      if (!best || r.d < best.d - 1e-9) best = { d: r.d, pt: r.pt, u: r.u, ti, end };
    }
    const pts = best.end ? p.slice().reverse() : p.slice();
    if (best.d > 0.02) pts.unshift(best.pt); else pts[0] = best.pt;
    const t = { kind: tubes[best.ti].kind === 'spine' ? 'limb' : 'twig', gen: 0, parent: best.ti, u: best.u, pts };
    tubes.push(t); return t;
  };
  const sprout = t => {                       // limb(k) -> tube + 2 * limb(k-1) * 0.55
    if (t.gen >= P.branch) return; const L = plen(t.pts); if (L < 0.3) return;
    const rs = resample(t.pts, 10), a = rs[6], b = rs[7]; let tx = b[0] - a[0], tz = b[1] - a[1];
    const tl = Math.hypot(tx, tz) || 1; tx /= tl; tz /= tl; const me = tubes.indexOf(t);
    for (const sg of [-1, 1]) {
      const pts = [a.slice()]; let x = a[0], z = a[1];
      for (let k = 0; k < 4; k++) { const ang = sg * (0.95 - 0.3 * k), c = Math.cos(ang), s = Math.sin(ang);
        x += (tx * c - tz * s) * L * 0.55 / 4; z += (tx * s + tz * c) * L * 0.55 / 4; pts.push([x, z]); }
      const ch = { kind: 'twig', gen: t.gen + 1, parent: me, u: 0.6, pts }; tubes.push(ch); sprout(ch);
    }
  };
  const roots = drawn.map(attach);
  if (!roots.some(t => t.kind === 'limb' && Math.abs(t.pts[t.pts.length - 1][0] - t.pts[0][0]) > 0.25)) {
    // nothing to walk on: grow stubby caterpillar prolegs along the spine
    const rs = resample(tubes[0].pts, 20);
    for (const i of [3, 8, 12, 17]) { const a = rs[i - 1], b = rs[i + 1], l = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, nx = (b[1] - a[1]) / l, nz = -(b[0] - a[0]) / l;
      for (const sg of [-1, 1]) { const t = attach([rs[i], [rs[i][0] + sg * nx * 0.55 - nz * 0.08, rs[i][1] + sg * nz * 0.55 + nx * 0.08]]); t.auto = true; } }
  }
  roots.forEach(sprout);

  // ---- lift into 3D ----
  const div = divOverride == null ? P.div : divOverride, dens = Math.pow(2, div) / 0.9;
  const K = P.bus, R = 0.15 + 0.13 * P.thick;
  const limbs = tubes.filter(t => t.kind === 'limb');
  const Hc = limbs.length ? clamp(0.5 * limbs.reduce((a, t) => a + plen(t.pts), 0) / limbs.length, 0.22, 0.85) : 0;
  let particles = 0;
  for (const t of tubes) {
    const L = plen(t.pts), n = t.nsec = clamp(Math.round(L * dens), 2, 48), c2 = resample(t.pts, n);
    const par = t.parent >= 0 ? tubes[t.parent] : null;
    const at = par ? clamp(Math.round(t.u * par.nsec), 0, par.nsec) : 0;
    t.len = L; t.rs = []; t.c = []; t.n1 = []; t.n2 = [];
    for (let i = 0; i <= n; i++) {
      const f = i / n;
      const r = t.kind === 'spine' ? R * (0.72 + 0.28 * Math.sin(Math.PI * (0.12 + 0.8 * f)))
        : (t.kind === 'limb' ? R * 0.62 : par.rs[at] * 0.78) * lerp(1, 0.62, f);
      t.rs.push(r);
    }
    for (let i = 0; i <= n; i++) {
      const f = i / n;                          // legs droop to the ground, twigs fan upward like antlers
      const y = !par ? Hc + R + 0.03 : t.kind === 'limb' ? lerp(par.c[at][1], t.rs[n] + 0.03, Math.pow(f, 1.5)) : par.c[at][1] + 0.3 * L * f;
      t.c.push([c2[i][0], y, c2[i][1]]);
    }
    for (let i = 0; i <= n; i++) {            // frame: n1 = dorsal, n2 = lateral
      const a = t.c[Math.max(i - 1, 0)], b = t.c[Math.min(i + 1, n)];
      let tx = b[0] - a[0], ty = b[1] - a[1], tz = b[2] - a[2]; const l = Math.hypot(tx, ty, tz) || 1; tx /= l; ty /= l; tz /= l;
      let ux = -ty * tx, uy = 1 - ty * ty, uz = -ty * tz, ul = Math.hypot(ux, uy, uz);
      if (ul < 0.05) { ux = 1 - tx * tx; uy = -tx * ty; uz = -tx * tz; ul = Math.hypot(ux, uy, uz); }
      ux /= ul; uy /= ul; uz /= ul;
      t.n1.push([ux, uy, uz]); t.n2.push([ty * uz - tz * uy, tz * ux - tx * uz, tx * uy - ty * ux]);
    }
    if (t.kind === 'limb') {
      const a = t.c[0], e = t.c[n]; let mx = 0; for (const q of t.c) mx += q[0]; mx /= n + 1;
      t.side = mx - a[0] >= 0 ? 1 : -1;
      t.axial = Math.abs(e[0] - a[0]) < 0.45 * Math.hypot(e[0] - a[0], e[2] - a[2]);
      t.sign = t.n2[1][2] >= 0 ? 1 : -1;
    }
    t.gain = (t.rs[0] + t.rs[n]) / 2 / (L / n);
    particles += (n + 1) * (K + 1);
  }
  if (particles > MAX_PARTICLES && div > 0) { const p = buildPlan(strokes, P, div - 1); p.clamped = true; return p; }
  for (const side of [-1, 1]) {               // alternating gait phases down each side
    limbs.filter(t => !t.axial && t.side === side).sort((a, b) => a.u - b.u)
      .forEach((t, i) => { t.phase = (i % 2 ? Math.PI : 0) + (side > 0 ? 0 : Math.PI); });
  }
  const legs = limbs.filter(t => !t.axial).length;
  return { tubes, K, div, R, Hc, legs, particles, toPad, toLocal, scale: sc };
}

// ---- Instantiate a plan as particles + distance constraints ----
function instantiate(plan, start, groundY) {
  const K = plan.K, per = K + 1, tubes = plan.tubes; let n = 0, nSec = 0;
  for (const t of tubes) { t.p0 = n; n += (t.nsec + 1) * per; t.s0 = nSec; nSec += t.nsec; }
  const X = new Float64Array(n * 3), cs = Math.cos(start.yaw), sn = Math.sin(start.yaw), th0 = Math.PI + Math.PI / K;
  const ang = []; for (let j = 0; j < K; j++) ang.push(th0 + TAU * j / K);
  for (const t of tubes) for (let i = 0; i <= t.nsec; i++) {
    const C = t.c[i], a = t.n1[i], b = t.n2[i], r = t.rs[i];
    for (let j = -1; j < K; j++) {
      const co = j < 0 ? 0 : r * Math.cos(ang[j]), si = j < 0 ? 0 : r * Math.sin(ang[j]);
      const lx = C[0] + co * a[0] + si * b[0], ly = C[1] + co * a[1] + si * b[1], lz = C[2] + co * a[2] + si * b[2];
      const k = (t.p0 + i * per + j + 1) * 3;
      X[k] = start.x + lx * cs + lz * sn; X[k + 1] = groundY + ly; X[k + 2] = start.z - lx * sn + lz * cs;
    }
  }
  const ca = [], cb = [], r0 = [], cd = [], cl = [], cc = [], cs_ = []; const w2 = [];
  const dist = (a, b) => Math.hypot(X[a * 3] - X[b * 3], X[a * 3 + 1] - X[b * 3 + 1], X[a * 3 + 2] - X[b * 3 + 2]);
  const add = (a, b, sec, d, l, c) => { w2.push(-1); ca.push(a); cb.push(b); r0.push(dist(a, b)); cs_.push(sec); cd.push(d); cl.push(l); cc.push(c); };
  const secTube = new Int16Array(nSec), secF = new Float32Array(nSec);
  tubes.forEach((t, ti) => {
    for (let i = 0; i <= t.nsec; i++) {
      const c = t.p0 + i * per;
      for (let j = 0; j < K; j++) { add(c, c + 1 + j, -1, 0, 0, 0); add(c + 1 + j, c + 1 + (j + 1) % K, -1, 0, 0, 0); }
      if (i === t.nsec) break;
      const s = t.s0 + i, d = c + per, L = dist(c, d); secTube[s] = ti; secF[s] = (i + 0.5) / t.nsec;
      add(c, d, s, 0, 0, 1);
      for (let j = 0; j < K; j++) {
        const j2 = (j + 1) % K, co = Math.cos(ang[j]), si = Math.sin(ang[j]), co2 = Math.cos(ang[j2]), si2 = Math.sin(ang[j2]);
        add(c + 1 + j, d + 1 + j, s, co, si, 1);                 // the bus: K longitudinal muscle wires
        // shear diagonals: their rest length is re-derived from the two wires they span, so they never fight the muscles
        const Lm = (dist(c + 1 + j, d + 1 + j) + dist(c + 1 + j2, d + 1 + j2)) / 2;
        for (const [a, b] of [[c + 1 + j, d + 1 + j2], [c + 1 + j2, d + 1 + j]]) {
          add(a, b, s, (co + co2) / 2, (si + si2) / 2, 1); const D = r0[r0.length - 1];
          w2[r0.length - 1] = Math.max(D * D - Lm * Lm, 0); r0[r0.length - 1] = Lm;
        }
      }
    }
  });
  for (const t of tubes) {                    // weld each limb's root ring into its parent
    if (t.parent < 0) continue; const par = tubes[t.parent], pn = (par.nsec + 1) * per;
    for (let j = 0; j < per; j++) {
      const a = t.p0 + j, near = [];

  cam.tx += (sim.cx - cam.tx) * .08; cam.ty += (sim.cy - cam.ty) * .08; cam.tz += (sim.cz - cam.tz) * .08;
  const cp = Math.cos(cam.pitch), eye = [cam.tx + cam.dist * cp * Math.sin(cam.yaw), cam.ty + cam.dist * Math.sin(cam.pitch), cam.tz + cam.dist * cp * Math.cos(cam.yaw)];
  if (!sim.w.flat) eye[1] = Math.max(eye[1], sim.w.sample(eye[0], eye[2]) + .4);
  gl.uniformMatrix4fv(R.uM, false, mat(eye, [cam.tx, cam.ty + .2, cam.tz], W > H ? .8 : 1.05, W / H)); gl.uniform3fv(R.uEye, eye);
  fillSkin();
  gl.uniform1i(R.uMode, 0); gl.bindBuffer(gl.ARRAY_BUFFER, R.terrain); bindFmt(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, R.terrainI);
  gl.drawElements(gl.TRIANGLES, R.terrainN, gl.UNSIGNED_SHORT, 0);
  if (R.wallsN) { gl.uniform1i(R.uMode, 2); gl.bindBuffer(gl.ARRAY_BUFFER, R.walls); bindFmt(); gl.drawArrays(gl.TRIANGLES, 0, R.wallsN); }
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, R.skinI);
  gl.uniform1i(R.uMode, 3); gl.bindBuffer(gl.ARRAY_BUFFER, R.shadow); gl.bufferData(gl.ARRAY_BUFFER, R.shadowData, gl.DYNAMIC_DRAW); bindFmt();
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
  gl.enable(gl.STENCIL_TEST); gl.stencilFunc(gl.EQUAL, 0, 255); gl.stencilOp(gl.KEEP, gl.KEEP, gl.INCR);   // one shadow layer, no double darkening
  gl.drawElements(gl.TRIANGLES, R.skinN, gl.UNSIGNED_SHORT, 0);
  gl.disable(gl.STENCIL_TEST); gl.disable(gl.BLEND); gl.depthMask(true);
  gl.uniform1i(R.uMode, 1); gl.bindBuffer(gl.ARRAY_BUFFER, R.skin); gl.bufferData(gl.ARRAY_BUFFER, R.skinData, gl.DYNAMIC_DRAW); bindFmt();
  gl.drawElements(gl.TRIANGLES, R.skinN, gl.UNSIGNED_SHORT, 0);
  gl.uniform1i(R.uMode, 2); gl.bindBuffer(gl.ARRAY_BUFFER, R.blobs); gl.bufferData(gl.ARRAY_BUFFER, R.blobData.subarray(0, blobN * FL), gl.DYNAMIC_DRAW); bindFmt();
  gl.drawArrays(gl.TRIANGLES, 0, blobN);
}

// ===================== simulate mode =====================
let world = null, worldKey = '';
function startSim() {
  if (!R || !plan) return;
  const key = course + seed; if (key !== worldKey) { world = course === 'maze' ? makeMaze(seed) : makeMountain(seed); buildWorldMesh(world); worldKey = key; }
  sim = new Sim(world, buildPlan(strokes, P)); sim.freq = +$('pFreq').value; sim.auto = $('auto').classList.contains('on');
  buildSkinIndex(sim.c);
  cam.yaw = world.start.yaw + Math.PI + .5; cam.pitch = course === 'maze' ? 1.0 : .5; cam.dist = course === 'maze' ? 9.5 : 7;
  cam.tx = sim.cx; cam.tz = sim.cz; cam.ty = 0; $('banner').classList.remove('on'); setPaused(false);
}
function setPaused(p) { paused = p; $('pause').textContent = p ? '▶ Play' : '❚❚ Pause'; }
function setTab(t) {
  tab = t; for (const b of $('tabs').children) b.classList.toggle('on', b.dataset.tab === t);
  $('draw').classList.toggle('on', t === 'draw'); $('sim').classList.toggle('on', t === 'sim');
  if (t === 'sim') { if (!plan) { setTab('draw'); return; } startSim(); } else drawPad();
}
for (const b of $('tabs').children) b.onclick = () => setTab(b.dataset.tab);
for (const b of $('courses').children) b.onclick = () => { course = b.dataset.course; for (const o of $('courses').children) o.classList.toggle('on', o === b); startSim(); };
$('reset').onclick = startSim; $('newc').onclick = () => { seed = 1 + (Math.random() * 9999 | 0); startSim(); };
$('pause').onclick = () => setPaused(!paused);
$('auto').onclick = e => { e.target.classList.toggle('on'); if (sim) sim.auto = e.target.classList.contains('on'); };
$('pFreq').oninput = e => { if (sim) sim.freq = +e.target.value; };
let steerL = false, steerR = false;                                // creature's own left is +x when it faces +z
const applySteer = () => { if (sim) sim.manual = (steerL ? -1 : 0) + (steerR ? 1 : 0); $('sl').classList.toggle('on', steerL); $('sr').classList.toggle('on', steerR); };
for (const [id, left] of [['sl', true], ['sr', false]]) { const b = $(id), set = v => e => { e.preventDefault(); left ? steerL = v : steerR = v; applySteer(); };
  b.addEventListener('pointerdown', set(true)); b.addEventListener('pointerup', set(false)); b.addEventListener('pointercancel', set(false)); b.addEventListener('pointerleave', set(false)); }
addEventListener('keydown', e => { if (e.key === 'ArrowLeft') steerL = true; else if (e.key === 'ArrowRight') steerR = true; else return; applySteer(); });
addEventListener('keyup', e => { if (e.key === 'ArrowLeft') steerL = false; else if (e.key === 'ArrowRight') steerR = false; else return; applySteer(); });
const ptrs = new Map(); let pinch = 0;                             // one finger orbits, two fingers zoom
glc.addEventListener('pointerdown', e => { glc.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); pinch = 0; });
glc.addEventListener('pointermove', e => { const p = ptrs.get(e.pointerId); if (!p) return;
  if (ptrs.size === 1) { cam.yaw -= (e.clientX - p[0]) * .008; cam.pitch = clamp(cam.pitch + (e.clientY - p[1]) * .006, .12, 1.5); }
  p[0] = e.clientX; p[1] = e.clientY;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) cam.dist = clamp(cam.dist * pinch / d, 2.5, 30); pinch = d; } });
const up = e => { ptrs.delete(e.pointerId); pinch = 0; }; glc.addEventListener('pointerup', up); glc.addEventListener('pointercancel', up);
glc.addEventListener('wheel', e => { e.preventDefault(); cam.dist = clamp(cam.dist * Math.exp(e.deltaY * .001), 2.5, 30); }, { passive: false });

let lastT = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame); const dt = Math.min((now - lastT) / 1000, .1); lastT = now;
  if (tab !== 'sim' || !sim || !R) return;
  if (!paused) { acc = Math.min(acc + dt, 2 / 60 + 1e-6); while (acc >= 1 / 60) { sim.step(1 / 60); acc -= 1 / 60; } }
  if (sim.cy < -20) { startSim(); return; }
  render();
  const n = sim.w.wps.length, t = sim.done ? sim.finish : sim.t;
  $('hud').innerHTML = `<b>${t.toFixed(1)}s</b><br>gate ${Math.min(sim.wp, n)}/${n}<br>${sim.c.n} nodes · ${sim.c.nc} springs`;
  if (sim.done && !$('banner').classList.contains('on')) { $('banner').textContent = `🏁 ${sim.finish.toFixed(1)}s`; $('banner').classList.add('on'); }
}
addEventListener('resize', () => { if (tab === 'draw') drawPad(); });
try { initGL(); } catch (e) { R = null; $('hud').textContent = 'Renderer failed: ' + e.message; }
rebuild(); requestAnimationFrame(frame);
window.__morph = { get sim() { return sim; }, setTab, cam };
})();
</script>
