<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HexChar — a hexagonal Unicode keyboard</title>
<meta name="description" content="A honeycomb-packed web keyboard for IPA and Unicode symbols.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+Math&family=Noto+Sans+Symbols+2&family=Noto+Music&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬡</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">⬡</span>
    <h1>HexChar</h1>
  </div>
  <div class="topbar-actions">
    <button type="button" id="btn-copy" class="ghost">Copy</button>
    <button type="button" id="btn-clear" class="ghost">Clear</button>
  </div>
</header>

<section class="composer">
  <label class="sr-only" for="text">Text</label>
  <textarea id="text" rows="2" spellcheck="false" autocapitalize="off" autocomplete="off"
            placeholder="Tap the honeycomb below…"></textarea>
  <div class="composer-meta">
    <span id="count">empty</span>
    <span id="tail" class="mono"></span>
  </div>
</section>

<div class="searchbar">
  <span class="searchbar-icon" aria-hidden="true">⌕</span>
  <label class="sr-only" for="search">Search characters</label>
  <input id="search" type="search" autocomplete="off" spellcheck="false"
         placeholder="Search by name or code point — “schwa”, “arrow”, U+2318">
  <button type="button" id="btn-search-clear" class="ghost small" hidden>✕</button>
</div>

<main class="board">
  <div class="board-head">
    <h2 id="cat-title">Vowels</h2>
    <span id="cat-count" class="muted"></span>
  </div>
  <div id="grid" class="grid" role="grid" aria-labelledby="cat-title" tabindex="0"></div>
  <p id="empty" class="empty" hidden>Nothing matches that.</p>
</main>

<nav class="catbar" aria-label="Character categories">
  <div id="cats" class="cats" role="tablist"></div>
  <button type="button" id="btn-back" class="catbar-key" title="Delete (⌫)" aria-label="Delete">⌫</button>
</nav>

<div id="tip" class="tip" role="presentation" hidden></div>

<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-name" hidden>
  <div class="sheet-card">
    <button type="button" id="sheet-close" class="ghost sheet-close" aria-label="Close">✕</button>
    <div class="sheet-glyph" id="sheet-glyph"></div>
    <h3 id="sheet-name"></h3>
    <dl class="sheet-facts" id="sheet-facts"></dl>
    <div class="sheet-actions">
      <button type="button" id="sheet-insert" class="primary">Insert</button>
      <button type="button" id="sheet-copy" class="ghost">Copy</button>
      <button type="button" id="sheet-fav" class="ghost" aria-pressed="false">♡ Favorite</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
