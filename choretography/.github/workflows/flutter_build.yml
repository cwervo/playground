# choretography/.github/workflows/flutter_build.yml
name: Flutter CI Build for Choretography

on:
  push:
    branches: [ main ] # Or your default branch
    paths:
      - 'choretography/**' # Trigger only if files within choretography/ change
  pull_request:
    branches: [ main ] # Or your default branch
    paths:
      - 'choretography/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./choretography # Set working directory for all run steps

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Flutter
      uses: subosito/flutter-action@v2 # Or dart-lang/setup-dart for Flutter
      with:
        flutter-version: '3.x' # Specify your Flutter version
        # channel: 'stable' # Optional: specify channel
        # cache: true # Optional: enable caching for faster builds

    - name: Get Flutter dependencies
      run: flutter pub get
      # working-directory: ./choretography # Redundant if defaults.run.working-directory is set

    - name: Analyze project source
      run: flutter analyze
      # working-directory: ./choretography

    - name: Run widget tests
      run: flutter test
      # working-directory: ./choretography

    - name: Build Flutter web application (example)
      run: flutter build web --release --base-href /choretography/
      # working-directory: ./choretography
      # The --base-href should match the path where it will be deployed on GitHub Pages,
      # if deploying from the root of the gh-pages branch to a /choretography/ subpath.

